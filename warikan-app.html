<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藍と紅の家計帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>
  :root{
    --bg:#F4F1EA;
    --ink:#24344D;
    --ink-soft:#63728A;
    --kenya:#345C7C;
    --kenya-soft:#D8E2E9;
    --akari:#9C3F4E;
    --akari-soft:#EEDBDD;
    --accent:#BF3B30;
    --card:#FFFFFF;
    --line:#E2DDD3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;min-height:100vh;}
  body{padding:24px 16px 60px;}

  .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  .card{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:20px;}
  .sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px;}

  /* 入力フォーム */
  .cat-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px;}
  .chip{
    padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);
    background:#fff;font-size:13px;font-family:"Noto Sans JP",sans-serif;
    color:var(--ink-soft);cursor:pointer;transition:all .12s;
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .other-input{
    width:100%;margin-top:8px;padding:10px 12px;
    border:1.5px solid var(--line);border-radius:8px;
    font-size:14px;font-family:"Noto Sans JP",sans-serif;
    color:var(--ink);background:var(--bg);outline:none;display:none;
  }
  .other-input:focus{border-color:var(--ink-soft);}
  .other-input.show{display:block;}
  .field-label{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin:14px 0 8px;}
  .payer-toggle{display:flex;gap:8px;}
  .payer-btn{
    flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;font-family:"Noto Sans JP",sans-serif;font-size:15px;
    font-weight:500;cursor:pointer;color:var(--ink-soft);transition:all .12s;
  }
  .payer-btn[data-active="true"][data-person="kenya"]{background:var(--kenya-soft);border-color:var(--kenya);color:var(--kenya);}
  .payer-btn[data-active="true"][data-person="akari"]{background:var(--akari-soft);border-color:var(--akari);color:var(--akari);}
  .amount-wrap{position:relative;}
  .amount-wrap .yen{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:15px;}
  .amount-wrap input{
    width:100%;padding:12px 12px 12px 28px;border:1.5px solid var(--line);border-radius:8px;
    font-size:18px;font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);outline:none;
  }
  .amount-wrap input:focus{border-color:var(--ink-soft);}
  .submit-btn{
    width:100%;margin-top:14px;padding:14px;border-radius:8px;border:none;
    background:var(--accent);color:#fff;font-family:"Noto Sans JP",sans-serif;
    font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer;
    box-shadow:0 3px 0 rgba(150,45,35,0.4);transition:transform .08s,box-shadow .08s;
  }
  .submit-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(150,45,35,0.4);}
  .submit-btn:disabled{background:#c0bab0;box-shadow:none;cursor:not-allowed;}
  .form-msg{font-size:12px;color:var(--accent);margin-top:8px;min-height:16px;}

  /* 記録一覧 */
  .tx-row{
    display:flex;align-items:center;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;
    transition:background .15s;
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-row.confirming{background:var(--bg);border-radius:8px;padding:11px 8px;}
  .tx-date{color:var(--ink-soft);font-size:12px;width:44px;flex-shrink:0;}
  .tx-payer{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;}
  .tx-payer.kenya{background:var(--kenya-soft);color:var(--kenya);}
  .tx-payer.akari{background:var(--akari-soft);color:var(--akari);}
  .tx-cat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-amount{font-weight:700;flex-shrink:0;}
  .tx-del{border:none;background:none;color:var(--line);cursor:pointer;font-size:15px;padding:4px 8px;flex-shrink:0;border-radius:6px;}
  .tx-del:hover{color:var(--accent);background:var(--akari-soft);}

  /* 削除確認パネル */
  .tx-confirm{
    display:none;width:100%;padding:10px 8px 6px;
    border-top:1px dashed var(--line);
    flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;
  }
  .tx-confirm.show{display:flex;}
  .tx-confirm-msg{font-size:12px;color:var(--ink-soft);flex:1;}
  .tx-confirm-btns{display:flex;gap:6px;}
  .btn-cancel{
    padding:6px 14px;border-radius:6px;border:1.5px solid var(--line);
    background:#fff;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--ink-soft);cursor:pointer;
  }
  .btn-delete{
    padding:6px 14px;border-radius:6px;border:none;
    background:var(--accent);color:#fff;font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:700;cursor:pointer;
  }

  .show-more-btn{
    width:100%;margin-top:12px;padding:10px;border-radius:8px;
    border:1.5px solid var(--line);background:#fff;
    font-family:"Noto Sans JP",sans-serif;font-size:13px;color:var(--ink-soft);cursor:pointer;
  }
  .show-more-btn:hover{color:var(--ink);}

  /* カテゴリ棒グラフ */
  .cat-row{margin-bottom:12px;}
  .cat-row:last-child{margin-bottom:0;}
  .cat-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .cat-top .cat-name{color:var(--ink);}
  .cat-top .cat-val{color:var(--ink-soft);font-weight:500;}
  .bar-track{height:7px;background:var(--line);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--kenya),var(--akari));}

  /* 収支バランス */
  .balance-row{display:flex;gap:8px;}
  .balance-person{flex:1;padding:14px 16px;border-radius:10px;}
  .balance-person.kenya{background:var(--kenya-soft);}
  .balance-person.akari{background:var(--akari-soft);}
  .balance-person .name{font-size:12px;font-weight:700;margin-bottom:4px;}
  .balance-person.kenya .name{color:var(--kenya);}
  .balance-person.akari .name{color:var(--akari);}
  .balance-person .amount{font-size:22px;font-weight:700;}
  .balance-person.kenya .amount{color:var(--kenya);}
  .balance-person.akari .amount{color:var(--akari);}
  .settle-box{
    margin-top:12px;padding:12px 14px;border-radius:8px;
    background:var(--bg);font-size:14px;line-height:1.7;text-align:center;
  }
  .settle-box b{padding:1px 5px;border-radius:4px;}
  .settle-box b.kenya{color:var(--kenya);background:var(--kenya-soft);}
  .settle-box b.akari{color:var(--akari);background:var(--akari-soft);}

  .empty{padding:20px 0;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.8;}
  .loading{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 入力フォーム -->
  <div class="card">
    <div class="sec-title">記録する</div>
    <div class="field-label">項目</div>
    <div class="cat-chips" id="catChips">
      <button type="button" class="chip" data-cat="スーパー" onclick="selectCat(this)">スーパー</button>
      <button type="button" class="chip" data-cat="100円ショップ" onclick="selectCat(this)">100円ショップ</button>
      <button type="button" class="chip" data-cat="ドラッグストア" onclick="selectCat(this)">ドラッグストア</button>
      <button type="button" class="chip" data-cat="Amazon" onclick="selectCat(this)">Amazon</button>
      <button type="button" class="chip" data-cat="外食" onclick="selectCat(this)">外食</button>
      <button type="button" class="chip" data-cat="移動費" onclick="selectCat(this)">移動費</button>
      <button type="button" class="chip" data-cat="家賃" onclick="selectCat(this)">家賃</button>
      <button type="button" class="chip" data-cat="光熱費" onclick="selectCat(this)">光熱費</button>
      <button type="button" class="chip" data-cat="サブスク" onclick="selectCat(this)">サブスク</button>
      <button type="button" class="chip" data-cat="__other__" onclick="selectCat(this)">その他</button>
    </div>
    <input type="text" class="other-input" id="otherInput" placeholder="項目を入力…">
    <div class="field-label">支払った人</div>
    <div class="payer-toggle">
      <button type="button" class="payer-btn" data-person="kenya" data-active="false" onclick="selectPayer('kenya')">けんや</button>
      <button type="button" class="payer-btn" data-person="akari" data-active="false" onclick="selectPayer('akari')">あかり</button>
    </div>
    <div class="field-label">金額</div>
    <div class="amount-wrap">
      <span class="yen">¥</span>
      <input type="number" id="amount" min="1" step="1" placeholder="0">
    </div>
    <button class="submit-btn" id="submitBtn" onclick="addTransaction()">記録する</button>
    <div class="form-msg" id="formMsg"></div>
  </div>

  <!-- 記録一覧 -->
  <div class="card">
    <div class="sec-title">記録一覧</div>
    <div id="ledgerCard"><div class="loading">読み込み中…</div></div>
  </div>

  <!-- カテゴリ別 -->
  <div class="card">
    <div class="sec-title">カテゴリ別</div>
    <div id="catCard"><div class="loading">読み込み中…</div></div>
  </div>

  <!-- 収支バランス -->
  <div class="card">
    <div class="sec-title">収支バランス</div>
    <div id="scaleCard"><div class="loading">読み込み中…</div></div>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFbYE1y7-HJbJULoFVi-xwpxaDf7balcydp5vUiZ3UoxgURLGW8a0ii27Lc7xPqCW6/exec";
const PEOPLE = { kenya: { label: "けんや" }, akari: { label: "あかり" } };
const POLL_MS = 20000;
const LEDGER_DEFAULT = 5;

let transactions = [];
let selectedPayer = null;
let selectedCat = null;
let ledgerExpanded = false;
let confirmingId = null;

function fmtYen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtShortDate(iso){ const d = new Date(iso); return (d.getMonth()+1) + "/" + d.getDate(); }
function escapeHtml(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function selectCat(btn){
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  selectedCat = btn.dataset.cat;
  const oi = document.getElementById("otherInput");
  if(selectedCat === "__other__"){ oi.classList.add("show"); oi.focus(); }
  else { oi.classList.remove("show"); oi.value = ""; }
}

function selectPayer(p){
  selectedPayer = p;
  document.querySelectorAll(".payer-btn").forEach(btn=>{
    btn.dataset.active = (btn.dataset.person === p) ? "true" : "false";
  });
}

function showFormMsg(msg){ document.getElementById("formMsg").textContent = msg; }

function gasRequest(params){
  return new Promise((resolve, reject) => {
    const cbName = "_gcb_" + Date.now() + "_" + Math.random().toString(36).slice(2,6);
    const timeout = setTimeout(() => {
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      reject(new Error("timeout"));
    }, 10000);
    window[cbName] = function(data){
      clearTimeout(timeout);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    const p = new URLSearchParams({...params, callback: cbName});
    const script = document.createElement("script");
    script.src = APPS_SCRIPT_URL + "?" + p.toString();
    script.onerror = () => { clearTimeout(timeout); delete window[cbName]; reject(new Error("script error")); };
    document.head.appendChild(script);
  });
}

async function refreshData(){
  try{
    const data = await gasRequest({});
    transactions = (data.transactions || []).sort((a,b) => (b.date+b.id).localeCompare(a.date+a.id));
  }catch(e){}
  renderAll();
}

async function addTransaction(){
  const otherInput = document.getElementById("otherInput");
  const amountInput = document.getElementById("amount");
  const category = (selectedCat === "__other__") ? otherInput.value.trim() : selectedCat;
  const amount = parseFloat(amountInput.value);

  if(!category){ showFormMsg("項目を選んでください。"); return; }
  if(!selectedPayer){ showFormMsg("支払った人を選んでください。"); return; }
  if(!amount || amount <= 0){ showFormMsg("金額を入力してください。"); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  showFormMsg("");

  const entry = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    category, payer: selectedPayer, amount, date: todayISO()
  };

  transactions.unshift(entry);
  renderAll();

  try{
    await gasRequest({ action: "add", ...entry });
    setTimeout(refreshData, 800);
  }catch(e){
    showFormMsg("保存に失敗しました。");
  }

  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  otherInput.classList.remove("show");
  otherInput.value = "";
  amountInput.value = "";
  selectedCat = null;
  selectedPayer = null;
  document.querySelectorAll(".payer-btn").forEach(b => b.dataset.active = "false");
  btn.disabled = false;
}

function requestDelete(id){
  // 同じ行を再タップしたらキャンセル
  if(confirmingId === id){
    confirmingId = null;
  } else {
    confirmingId = id;
  }
  renderLedger();
}

function cancelDelete(){
  confirmingId = null;
  renderLedger();
}

async function confirmDelete(id){
  confirmingId = null;
  transactions = transactions.filter(t => t.id !== id);
  renderAll();
  try{ await gasRequest({ action: "delete", id }); setTimeout(refreshData, 800); }catch(e){}
}

function renderAll(){
  renderLedger();
  renderCat();
  renderScale();
}

function renderLedger(){
  const el = document.getElementById("ledgerCard");
  if(transactions.length === 0){
    el.innerHTML = `<div class="empty">まだ記録がありません。</div>`;
    return;
  }

  const visible = ledgerExpanded ? transactions : transactions.slice(0, LEDGER_DEFAULT);
  const rows = visible.map(t => {
    const isConfirming = confirmingId === t.id;
    return `
      <div class="tx-row${isConfirming ? " confirming" : ""}">
        <span class="tx-date">${fmtShortDate(t.date)}</span>
        <span class="tx-payer ${t.payer}">${PEOPLE[t.payer].label}</span>
        <span class="tx-cat">${escapeHtml(t.category)}</span>
        <span class="tx-amount">${fmtYen(t.amount)}</span>
        <button class="tx-del" title="削除" onclick="requestDelete('${t.id}')">✕</button>
      </div>
      <div class="tx-confirm${isConfirming ? " show" : ""}">
        <span class="tx-confirm-msg">この記録を削除しますか？</span>
        <div class="tx-confirm-btns">
          <button class="btn-cancel" onclick="cancelDelete()">キャンセル</button>
          <button class="btn-delete" onclick="confirmDelete('${t.id}')">削除する</button>
        </div>
      </div>
    `;
  }).join("");

  const moreBtn = (transactions.length > LEDGER_DEFAULT)
    ? `<button class="show-more-btn" onclick="toggleLedger()">${ledgerExpanded ? "▲ 折りたたむ" : "▼ 全件表示（あと" + (transactions.length - LEDGER_DEFAULT) + "件）"}</button>`
    : "";

  el.innerHTML = rows + moreBtn;
}

function toggleLedger(){
  ledgerExpanded = !ledgerExpanded;
  renderLedger();
}

function renderCat(){
  const el = document.getElementById("catCard");
  if(transactions.length === 0){
    el.innerHTML = `<div class="empty">記録するとここに表示されます。</div>`;
    return;
  }
  const byCat = {};
  transactions.forEach(t => { byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const maxVal = Math.max(...Object.values(byCat));
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat, val])=>`
    <div class="cat-row">
      <div class="cat-top">
        <span class="cat-name">${escapeHtml(cat)}</span>
        <span class="cat-val">${fmtYen(val)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((val/maxVal)*100)}%"></div></div>
    </div>
  `).join("");
  el.innerHTML = rows;
}

function renderScale(){
  const el = document.getElementById("scaleCard");
  const totalKenya = transactions.filter(t=>t.payer==="kenya").reduce((s,t)=>s+t.amount,0);
  const totalAkari = transactions.filter(t=>t.payer==="akari").reduce((s,t)=>s+t.amount,0);
  const sum = totalKenya + totalAkari;

  if(sum === 0){
    el.innerHTML = `<div class="empty">記録するとここに表示されます。</div>`;
    return;
  }

  const diff = totalKenya - totalAkari;
  const settle = Math.abs(diff) / 2;
  let settleHtml;
  if(Math.round(settle) === 0){
    settleHtml = `ちょうど半々です。精算不要。`;
  } else if(diff > 0){
    settleHtml = `<b class="akari">あかり</b> → <b class="kenya">けんや</b> に ${fmtYen(settle)} 渡すと精算`;
  } else {
    settleHtml = `<b class="kenya">けんや</b> → <b class="akari">あかり</b> に ${fmtYen(settle)} 渡すと精算`;
  }

  el.innerHTML = `
    <div class="balance-row">
      <div class="balance-person kenya">
        <div class="name">けんや</div>
        <div class="amount">${fmtYen(totalKenya)}</div>
      </div>
      <div class="balance-person akari">
        <div class="name">あかり</div>
        <div class="amount">${fmtYen(totalAkari)}</div>
      </div>
    </div>
    <div class="settle-box">${settleHtml}</div>
  `;
}

refreshData();
setInterval(refreshData, POLL_MS);
</script>
</body>
</html>
